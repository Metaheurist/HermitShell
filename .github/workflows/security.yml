# HermitShell - Security
# Every push and pull request, and every Monday so newly published CVEs are caught even when
# nothing has changed: secret scan of the full history, the security test suites (Python and
# Worker), Bandit static analysis, CVE audits of the Python and npm dependencies, dependency
# review on pull requests and CodeQL code scanning.
name: Security

on:
  push:
  pull_request:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    name: "Security · Secret scan (Gitleaks, full history)"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - name: Restore Gitleaks binary
        id: gitleaks-cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: gitleaks
          key: gitleaks-8.28.0-${{ runner.os }}-x64
      - name: Download Gitleaks
        if: steps.gitleaks-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          VERSION=8.28.0
          SHA256=a65b5253807a68ac0cafa4414031fd740aeb55f54fb7e55f386acb52e6a840eb
          curl -sSfL -o gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz"
          echo "${SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          chmod +x gitleaks
      - name: Scan every commit
        run: ./gitleaks git --redact --verbose --exit-code 1 .

  security-tests-python:
    name: "Security · Tests · Python (hostile input, data at rest, backups)"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: pytest tests/security
        run: python -m pytest tests/security -v

  security-tests-worker:
    name: "Security · Tests · Feedback Worker (headers, escaping, auth, limits)"
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: packages/daily-vacancy-report/feedback-worker
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: packages/daily-vacancy-report/feedback-worker/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Vitest security suite
        run: npx vitest run security

  bandit:
    name: "Security · Static analysis · Python (Bandit)"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Install Bandit
        run: python -m pip install bandit==1.9.4
      - name: Bandit (medium and high severity fail)
        run: bandit -c .bandit.yml -r common packages scripts -ll

  python-cve:
    name: "Security · CVE audit · Python packages (pip-audit)"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Install pip-audit
        run: python -m pip install pip-audit
      - name: Audit requirements-dev.txt
        run: pip-audit -r requirements-dev.txt --strict --desc

  npm-cve:
    name: "Security · CVE audit · Feedback Worker npm packages (npm audit)"
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: packages/daily-vacancy-report/feedback-worker
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: packages/daily-vacancy-report/feedback-worker/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: npm audit (high and critical fail the build)
        run: npm audit --audit-level=high

  dependency-review:
    name: "Security · Dependency review (pull requests)"
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4
        with:
          fail-on-severity: high

  codeql:
    name: "Security · CodeQL · ${{ matrix.language }}"
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript-typescript, actions]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-extended
      - uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4
        with:
          category: "/language:${{ matrix.language }}"
