# HermitShell - Security
# Every push and pull request, and every Monday so newly published CVEs are caught even when
# nothing has changed: secret scan of the full history, CVE audits of the Python and npm
# dependencies, dependency review on pull requests and CodeQL code scanning.
name: Security

on:
  push:
  pull_request:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    name: "Security · Secret scan (Gitleaks, full history)"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Restore Gitleaks binary
        id: gitleaks-cache
        uses: actions/cache@v5
        with:
          path: gitleaks
          key: gitleaks-8.28.0-${{ runner.os }}-x64
      - name: Download Gitleaks
        if: steps.gitleaks-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          VERSION=8.28.0
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz" | tar -xz gitleaks
          chmod +x gitleaks
      - name: Scan every commit
        run: ./gitleaks git --redact --verbose --exit-code 1 .

  python-cve:
    name: "Security · CVE audit · Python packages (pip-audit)"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install pip-audit
        run: python -m pip install pip-audit
      - name: Audit requirements-dev.txt
        run: pip-audit -r requirements-dev.txt --strict --desc

  npm-cve:
    name: "Security · CVE audit · Feedback Worker npm packages (npm audit)"
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: packages/daily-vacancy-report/feedback-worker
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: packages/daily-vacancy-report/feedback-worker/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: npm audit (high and critical fail the build)
        run: npm audit --audit-level=high

  dependency-review:
    name: "Security · Dependency review (pull requests)"
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high

  codeql:
    name: "Security · CodeQL · ${{ matrix.language }}"
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript-typescript, actions]
    steps:
      - uses: actions/checkout@v5
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-extended
      - uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
