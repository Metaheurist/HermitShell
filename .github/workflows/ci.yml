name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python tests (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: .github/workflows/ci.yml
      - name: Install test dependencies
        run: python -m pip install --upgrade pip pytest requests
      - name: Check every script compiles
        run: python -m compileall -q common packages scripts
      - name: Vacancy report tests
        run: python -m pytest packages/daily-vacancy-report/tests -v

  worker:
    name: Feedback Worker tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/daily-vacancy-report/feedback-worker
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: packages/daily-vacancy-report/feedback-worker/package-lock.json
      - name: Install
        run: npm ci
      - name: Vitest
        run: npm test
