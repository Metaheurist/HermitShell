# HermitShell - Playwright
# Every push and pull request: the feedback Worker's pages tested in Chromium. The Worker runs locally under
# `wrangler dev` (workerd with local KV and Durable Objects), seeded with fictional recruits; no Cloudflare
# account or secrets are used.
name: Playwright

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: playwright-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: "Browser tests · Feedback Worker (Chromium)"
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: packages/daily-vacancy-report/feedback-worker
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: packages/daily-vacancy-report/feedback-worker/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Playwright
        run: npm run e2e
      - name: Upload the report and traces
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            packages/daily-vacancy-report/feedback-worker/playwright-report/
            packages/daily-vacancy-report/feedback-worker/test-results/
          retention-days: 14
          if-no-files-found: ignore
