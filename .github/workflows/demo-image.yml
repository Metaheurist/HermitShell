# HermitShell - Demo image (docs/demo-image.md)
# Builds the demo image natively for amd64 and arm64, starts each with no network at all to prove it seeds its
# fictional people and jobs offline, and scans it (Trivy: vulnerabilities and secrets; fixable critical CVEs and any
# secret fail). Pushes to main and version tags then publish both by digest and merge them into one tag list at
# ghcr.io/<owner>/hermitshell-demo; a version tag's release also gets the image files.
name: Demo image

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths: ["demo/**", "explore/**", "packages/**", "common/**", "scripts/**", "requirements.txt", ".github/workflows/demo-image.yml"]
  pull_request:
    paths: ["demo/**", "explore/**", "packages/**", "common/**", "scripts/**", "requirements.txt", ".github/workflows/demo-image.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: demo-image-${{ github.ref }}
  cancel-in-progress: true

env:
  TEST_TAG: hermitshell-demo:test

jobs:
  build:
    name: "Demo image · ${{ matrix.arch }}"
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        if: matrix.arch == 'amd64'
        with:
          node-version: 22
      - name: Replay and viewer tests
        if: matrix.arch == 'amd64'
        run: node --test explore/replay/test/replay.test.mjs demo/viewer/test/viewer.test.mjs
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Image name
        id: name
        run: echo "image=ghcr.io/$(printf '%s' "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')/hermitshell-demo" >> "$GITHUB_OUTPUT"

      - name: Build for the smoke test
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: demo/Dockerfile
          load: true
          tags: ${{ env.TEST_TAG }}
          build-args: VERSION=${{ github.ref_name }}
          cache-from: type=gha,scope=demo-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=demo-${{ matrix.arch }}

      - name: Smoke test (no network; seeds the demo people offline)
        run: |
          set -eu
          docker run -d --name smoke --network none --cap-drop ALL --security-opt no-new-privileges:true \
            --shm-size 1g "$TEST_TAG" app
          for i in $(seq 1 120); do
            if docker logs smoke 2>&1 | grep -q "\[demo\] demo data ready"; then break; fi
            if [ "$(docker inspect -f '{{.State.Running}}' smoke)" != true ] || [ "$i" = 120 ]; then
              docker logs smoke 2>&1 | tail -n 200; exit 1
            fi
            sleep 10
          done
          if docker logs smoke 2>&1 | grep -q "seeding finished with failures"; then docker logs smoke 2>&1 | tail -n 200; exit 1; fi
          docker exec -e NODE_EXTRA_CA_CERTS=/data/explore/certs/ca.pem smoke node -e "fetch('https://localhost:8787/privacy').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))" \
            || { echo "the Worker did not answer"; exit 1; }
          [ "$(docker exec smoke id -u)" = 10000 ]
          docker rm -f smoke

      - name: Restore Trivy binary
        if: matrix.arch == 'amd64'
        id: trivy-cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: trivy
          key: trivy-0.74.0-${{ runner.os }}-x64
      - name: Download Trivy
        if: matrix.arch == 'amd64' && steps.trivy-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          VERSION=0.74.0
          SHA256=2ae6fe3ee734b7fdf11335663e18c75ea12dccc76062f09f164a3b0f8be4371a
          curl -sSfL -o trivy.tar.gz "https://github.com/aquasecurity/trivy/releases/download/v${VERSION}/trivy_${VERSION}_Linux-64bit.tar.gz"
          echo "${SHA256}  trivy.tar.gz" | sha256sum -c -
          tar -xzf trivy.tar.gz trivy
          chmod +x trivy
      - name: Scan the image (fixable critical CVEs and any secret fail)
        if: matrix.arch == 'amd64'
        run: ./trivy image --scanners vuln,secret --severity CRITICAL --ignore-unfixed --exit-code 1 --no-progress "$TEST_TAG"

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish by digest
        id: publish
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: demo/Dockerfile
          platforms: linux/${{ matrix.arch }}
          build-args: VERSION=${{ github.ref_name }}
          labels: org.opencontainers.image.title=hermitshell-demo
          outputs: type=image,name=${{ steps.name.outputs.image }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=demo-${{ matrix.arch }}
      - name: Keep the digest
        if: github.event_name != 'pull_request'
        env:
          DIGEST: ${{ steps.publish.outputs.digest }}
        run: |
          set -eu
          case "$DIGEST" in sha256:*) ;; *) echo "no digest"; exit 1 ;; esac
          mkdir -p digests
          touch "digests/${DIGEST#sha256:}"
      - name: Upload the digest
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: demo-digest-${{ matrix.arch }}
          path: digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: "Demo image · Publish tags"
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.merge.outputs.image }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: demo-digest-*
          path: digests
          merge-multiple: true
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Image names and tags
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/hermitshell-demo
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Merge the platforms into one tag list
        id: merge
        working-directory: digests
        env:
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          IMAGE=ghcr.io/$(printf '%s' "$OWNER" | tr '[:upper:]' '[:lower:]')/hermitshell-demo
          [ "$(ls | wc -l)" = 2 ] || { echo "expected two platform digests"; exit 1; }
          tags=$(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          # shellcheck disable=SC2046,SC2086
          docker buildx imagetools create $tags $(printf "$IMAGE@sha256:%s " *)
          docker buildx imagetools inspect "$IMAGE:$DOCKER_METADATA_OUTPUT_VERSION"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"
          {
            echo "### Published"
            echo '```'
            jq -r '.tags[]' <<< "$DOCKER_METADATA_OUTPUT_JSON"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  release:
    name: "Demo image · Release files"
    needs: merge
    if: github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: read
    env:
      GH_TOKEN: ${{ github.token }}
      ACTOR: ${{ github.actor }}
      IMAGE: ${{ needs.merge.outputs.image }}
      REF_NAME: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Save the image for each platform
        run: |
          set -euo pipefail
          name=${REF_NAME#v}
          case "$name" in *[!A-Za-z0-9._-]*) echo "unexpected release name"; exit 1 ;; esac
          command -v skopeo >/dev/null || { sudo apt-get update -q && sudo apt-get install -yq skopeo; }
          printf '%s' "$GH_TOKEN" | skopeo login ghcr.io -u "$ACTOR" --password-stdin
          mkdir dist
          for arch in amd64 arm64; do
            skopeo copy --quiet --override-os linux --override-arch "$arch" "docker://$IMAGE:$name" \
              "docker-archive:dist/hermitshell-demo-$name-$arch.tar:$IMAGE:$name"
            gzip -6 "dist/hermitshell-demo-$name-$arch.tar"
          done
          cp demo/docker-compose.demo.yml dist/
          (cd dist && sha256sum -- * > SHA256SUMS-demo)
      - name: Attach to the release (made by the Image workflow)
        run: |
          set -euo pipefail
          for i in $(seq 1 60); do
            gh release view "$REF_NAME" >/dev/null 2>&1 && break
            [ "$i" = 60 ] && { echo "no release for $REF_NAME after 30 minutes"; exit 1; }
            sleep 30
          done
          gh release upload "$REF_NAME" dist/* --clobber
