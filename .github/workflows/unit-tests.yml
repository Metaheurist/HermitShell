# HermitShell - Unit tests
# Every push and pull request: lint, compile check, unit tests for each part of the repo on the
# oldest and newest supported Python, the feedback Worker's tests and a Worker build check.
name: Unit tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: unit-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: "1 · Lint (Ruff)"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Install Ruff
        run: python -m pip install ruff==0.16.9
      - name: Ruff
        run: ruff check --output-format github .

  compile:
    name: "1 · Compile check (Python 3.10)"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.10"
      - name: Compile every script
        run: python -m compileall -q common packages scripts tests

  python-tests:
    name: "1 · Unit tests · ${{ matrix.suite.name }} (Python ${{ matrix.python }})"
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12"]
        suite:
          - { name: Shared library, path: common/tests }
          - { name: Vacancy report, path: packages/daily-vacancy-report/tests }
          - { name: Setup wizard, path: scripts/tests }
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: pytest
        run: python -m pytest ${{ matrix.suite.path }} -v --junitxml=junit.xml
      - name: Test summary
        if: always()
        shell: python
        env:
          TITLE: "${{ matrix.suite.name }} (Python ${{ matrix.python }})"
        run: |
          import os
          import xml.etree.ElementTree as ET

          lines = [f"### {os.environ['TITLE']}", ""]
          if os.path.exists("junit.xml"):
              root = ET.parse("junit.xml").getroot()
              suite = root if root.tag == "testsuite" else root.find("testsuite")
              total, failed = int(suite.get("tests")), int(suite.get("failures")) + int(suite.get("errors"))
              skipped = int(suite.get("skipped"))
              lines += ["| Passed | Failed | Skipped | Time |", "| --- | --- | --- | --- |",
                        f"| {total - failed - skipped} | {failed} | {skipped} | {float(suite.get('time')):.2f}s |"]
          else:
              lines.append("pytest did not produce a report.")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as fh:
              fh.write("\n".join(lines) + "\n")

  worker-tests:
    name: "1 · Unit tests · Feedback Worker (Node 22)"
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: packages/daily-vacancy-report/feedback-worker
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: packages/daily-vacancy-report/feedback-worker/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Vitest
        run: npm test

  worker-build:
    name: "2 · Build check · Feedback Worker (wrangler dry run)"
    needs: worker-tests
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: packages/daily-vacancy-report/feedback-worker
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: packages/daily-vacancy-report/feedback-worker/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Bundle without deploying
        run: npx wrangler deploy --dry-run --outdir dist

  all-checks:
    name: "3 · All unit tests passed"
    if: always()
    needs: [lint, compile, python-tests, worker-tests, worker-build]
    runs-on: ubuntu-24.04
    steps:
      - name: Check results
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Job results: $RESULTS"
          for result in $RESULTS; do
            [ "$result" = "success" ] || exit 1
          done
