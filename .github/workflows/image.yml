# HermitShell - Container image
# Every push and pull request builds the image natively on amd64 and arm64 runners, starts each with an empty data
# folder to check the scheduler comes up with the standard jobs, and scans it for fixable critical CVEs (Trivy).
# Pushes to main and version tags then publish both by digest and merge them into one tag list at
# ghcr.io/<owner>/hermitshell, where servers running scripts/host/hermitshell-update.sh pick it up within 10
# minutes, and attach it to a GitHub release: a version tag gets its own release, and each push to main replaces
# the rolling "latest-build" pre-release.
name: Image

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore: ["docs/**", "**/*.md", "**/tests/**", "tests/**", "scripts/screenshots/**", "explore/**", "demo/**", ".github/workflows/demo-image.yml"]
  pull_request:
    paths-ignore: ["docs/**", "**/*.md", "**/tests/**", "tests/**", "scripts/screenshots/**", "explore/**", "demo/**", ".github/workflows/demo-image.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    name: "Image · ${{ matrix.arch }}"
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    env:
      TEST_TAG: hermitshell:test
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Image name
        id: name
        run: echo "image=ghcr.io/$(printf '%s' "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')/hermitshell" >> "$GITHUB_OUTPUT"
      - name: Image names and tags
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/hermitshell
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short
          labels: |
            org.opencontainers.image.title=hermitshell

      - name: Build for the smoke test
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: ${{ env.TEST_TAG }}
          build-args: VERSION=${{ steps.meta.outputs.version }}
          cache-from: type=gha,scope=image-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=image-${{ matrix.arch }}

      - name: Smoke test (empty data folder, scheduler, doctor)
        run: |
          set -eu
          mkdir -p "$RUNNER_TEMP/data"
          sudo chown 10000:10000 "$RUNNER_TEMP/data"
          docker run -d --name smoke --read-only --tmpfs /tmp --cap-drop ALL \
            --security-opt no-new-privileges:true -v "$RUNNER_TEMP/data:/data" "$TEST_TAG"
          for i in $(seq 1 30); do
            docker exec smoke python3 /data/scripts/scheduler.py health && break
            [ "$i" = 30 ] && { docker logs smoke; exit 1; }
            sleep 2
          done
          docker exec smoke python3 /data/scripts/scheduler.py list
          jobs=$(docker exec smoke python3 /data/scripts/scheduler.py list --json | python3 -c 'import json,sys; print(len(json.load(sys.stdin)))')
          [ "$jobs" -ge 5 ] || { echo "expected the standard jobs, found $jobs"; exit 1; }
          docker exec smoke python3 /data/scripts/doctor.py --only python,packages
          docker exec -w /data/scripts smoke python3 -c 'import hermes_common, scheduler, profiles, job_scanner, websockets.sync.client'
          [ "$(docker exec smoke id -u)" = 10000 ]
          docker rm -f smoke

      - name: Restore Trivy binary
        if: matrix.arch == 'amd64'
        id: trivy-cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: trivy
          key: trivy-0.74.0-${{ runner.os }}-x64
      - name: Download Trivy
        if: matrix.arch == 'amd64' && steps.trivy-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          VERSION=0.74.0
          SHA256=2ae6fe3ee734b7fdf11335663e18c75ea12dccc76062f09f164a3b0f8be4371a
          curl -sSfL -o trivy.tar.gz "https://github.com/aquasecurity/trivy/releases/download/v${VERSION}/trivy_${VERSION}_Linux-64bit.tar.gz"
          echo "${SHA256}  trivy.tar.gz" | sha256sum -c -
          tar -xzf trivy.tar.gz trivy
          chmod +x trivy
      - name: Scan the image (fixable critical CVEs fail)
        if: matrix.arch == 'amd64'
        run: ./trivy image --severity CRITICAL --ignore-unfixed --exit-code 1 --no-progress "$TEST_TAG"

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish by digest
        id: publish
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ steps.meta.outputs.version }}
          outputs: type=image,name=${{ steps.name.outputs.image }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=image-${{ matrix.arch }}
      - name: Keep the digest
        if: github.event_name != 'pull_request'
        env:
          DIGEST: ${{ steps.publish.outputs.digest }}
        run: |
          set -eu
          case "$DIGEST" in sha256:*) ;; *) echo "no digest"; exit 1 ;; esac
          mkdir -p digests
          touch "digests/${DIGEST#sha256:}"
      - name: Upload the digest
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: image-digest-${{ matrix.arch }}
          path: digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: "Image · Publish tags"
    needs: image
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.merge.outputs.digest }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: image-digest-*
          path: digests
          merge-multiple: true
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Image names and tags
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/hermitshell
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Merge the platforms into one tag list
        id: merge
        working-directory: digests
        env:
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          IMAGE=ghcr.io/$(printf '%s' "$OWNER" | tr '[:upper:]' '[:lower:]')/hermitshell
          [ "$(ls | wc -l)" = 2 ] || { echo "expected two platform digests"; exit 1; }
          tags=$(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          # shellcheck disable=SC2046,SC2086
          docker buildx imagetools create $tags $(printf "$IMAGE@sha256:%s " *)
          digest=$(docker buildx imagetools inspect "$IMAGE:$DOCKER_METADATA_OUTPUT_VERSION" --format '{{json .Manifest}}' | jq -r .digest)
          case "$digest" in sha256:*) ;; *) echo "no digest for the tag list"; exit 1 ;; esac
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          {
            echo "### Published"
            echo '```'
            jq -r '.tags[]' <<< "$DOCKER_METADATA_OUTPUT_JSON"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  release:
    name: "Image · GitHub release"
    needs: merge
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      OWNER: ${{ github.repository_owner }}
      DIGEST: ${{ needs.merge.outputs.digest }}
      REF_TYPE: ${{ github.ref_type }}
      REF_NAME: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Save the published image for each platform
        run: |
          set -euo pipefail
          case "$DIGEST" in sha256:*) ;; *) echo "no image digest from the build"; exit 1 ;; esac
          IMAGE=ghcr.io/$(printf '%s' "$OWNER" | tr '[:upper:]' '[:lower:]')/hermitshell
          if [ "$REF_TYPE" = tag ]; then name=${REF_NAME#v}; else name=$(git rev-parse --short=7 HEAD); fi
          case "$name" in *[!A-Za-z0-9._-]*) echo "unexpected release name"; exit 1 ;; esac
          command -v skopeo >/dev/null || { sudo apt-get update -q && sudo apt-get install -yq skopeo; }
          mkdir dist
          for arch in amd64 arm64; do
            skopeo copy --quiet --override-os linux --override-arch "$arch" "docker://$IMAGE@$DIGEST" \
              "docker-archive:dist/hermitshell-$name-$arch.tar:$IMAGE:$name"
            gzip -6 "dist/hermitshell-$name-$arch.tar"
          done
          cp docker-compose.yml dist/
          (cd dist && sha256sum -- * > SHA256SUMS)
          printf 'NAME=%s\nIMAGE=%s\n' "$name" "$IMAGE" >> "$GITHUB_ENV"
      - name: Release notes
        run: |
          set -euo pipefail
          {
            echo "Container image \`$IMAGE@$DIGEST\`, built from $GITHUB_SHA."
            echo
            echo '```sh'
            echo "docker pull $IMAGE@$DIGEST"
            echo '```'
            echo
            echo "Without registry access, load the file for your platform and run it with the compose file:"
            echo
            echo '```sh'
            echo "sha256sum -c --ignore-missing SHA256SUMS"
            echo "gunzip -c hermitshell-$NAME-amd64.tar.gz | docker load"
            echo "HERMITSHELL_IMAGE=$IMAGE:$NAME docker compose up -d"
            echo '```'
            echo
            echo "Setup, updates and moving from Hermes: [docs/installation.md](https://github.com/$GITHUB_REPOSITORY/blob/$GITHUB_SHA/docs/installation.md)."
          } > notes.md
      - name: Publish the release
        run: |
          set -euo pipefail
          if [ "$REF_TYPE" = tag ]; then
            gh release create "$REF_NAME" dist/* --verify-tag --title "HermitShell $NAME" \
              --notes-file notes.md --generate-notes
          else
            gh release delete latest-build --cleanup-tag --yes 2>/dev/null || true
            gh release create latest-build dist/* --target "$GITHUB_SHA" --prerelease \
              --title "Latest build ($NAME)" --notes-file notes.md
          fi
